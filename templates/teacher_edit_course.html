<!DOCTYPE html>
<html><head><title>修改课程信息</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="card">
    <h2>✏️ 修改课程信息</h2>
    <form method="post">
        <div class="form-group"><label>课程号（不可修改）</label><input type="text" value="{{ course.id }}" disabled></div>
        <div class="form-group"><label>课程名</label><input type="text" name="name" value="{{ course.name }}" required></div>
        <div class="form-group"><label>学分</label><input type="number" name="credit" value="{{ course.credit }}" required></div>
        <div class="form-group"><label>课程类型</label><input type="text" name="type" value="{{ course.type }}"></div>
        <div class="form-group"><label>课程简介</label><textarea name="intro" rows="4">{{ course.intro }}</textarea></div>
        <button type="submit">保存修改</button>
    </form>
    <div class="links"><a href="/teacher">← 返回我的课程</a></div>
</div>
</body>
</html>
