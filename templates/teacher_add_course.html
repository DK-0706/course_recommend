<!DOCTYPE html>
<html><head><title>发布新课程</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="card">
    <h2>📢 发布新课程</h2>
    <form method="post">
        <div class="form-group"><label>课程号</label><input type="text" name="id" required placeholder="例如：105"></div>
        <div class="form-group"><label>课程名</label><input type="text" name="name" required></div>
        <div class="form-group"><label>学分</label><input type="number" name="credit" required></div>
        <div class="form-group"><label>课程类型</label><input type="text" name="type" placeholder="如：专业课/公共课"></div>
        <div class="form-group"><label>课程简介</label><textarea name="intro" rows="4"></textarea></div>
        <button type="submit">立即发布</button>
        {% if msg %}<div class="error">{{ msg }}</div>{% endif %}
    </form>
    <div class="links"><a href="/teacher">← 返回我的课程</a></div>
</div>
</body>
</html>
</html>
