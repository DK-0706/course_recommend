<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>管理员登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8">
        <h2 class="text-2xl font-bold text-center mb-6">🔐 管理员登录</h2>
        <form method="post">
            <div class="mb-4"><label class="block text-gray-700 mb-2">用户名</label><input type="text" name="username" required class="w-full px-4 py-2 border rounded-lg"></div>
            <div class="mb-6"><label class="block text-gray-700 mb-2">密码</label><input type="password" name="password" required class="w-full px-4 py-2 border rounded-lg"></div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">登录</button>
            {% if msg %}<div class="text-red-500 text-center mt-4">{{ msg }}</div>{% endif %}
        </form>
        <div class="text-center mt-6 space-x-4">
            <a href="/register/admin" class="text-blue-600 hover:underline">管理员注册</a>
            <a href="/login/student" class="text-blue-600 hover:underline">学生登录</a>
            <a href="/login/teacher" class="text-blue-600 hover:underline">教师登录</a>
        </div>
    </div>
</body>
</html>
